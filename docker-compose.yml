services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: root
        uid: 1000
    image: buildflow-app
    container_name: buildflow-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - buildflow
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: buildflow-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d/
    networks:
      - buildflow

  db:
    image: mysql:8.0
    container_name: buildflow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - buildflow

  redis:
    image: redis:alpine
    container_name: buildflow-redis
    restart: unless-stopped
    networks:
      - buildflow

networks:
  buildflow:
    driver: bridge

volumes:
  dbdata:
